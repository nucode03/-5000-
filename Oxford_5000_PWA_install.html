<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oxford 5000 앱 설치</title>
    <style>
      :root {
        color: #1f2937;
        background: #f7f9fc;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      main {
        width: min(100%, 42rem);
        min-height: 100vh;
        margin: 0 auto;
        padding: 2rem 1.25rem;
        background: #fff;
      }
      .title {
        margin: -2rem -1.25rem 1.25rem;
        padding: 2rem 1.25rem 1.4rem;
        color: #fff;
        background: #163a5f;
      }
      p, h1, h2 { margin: 0; }
      .eyebrow { margin-bottom: .35rem; font-size: .8rem; font-weight: 700; opacity: .78; }
      h1 { font-size: 1.7rem; line-height: 1.2; }
      .card {
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid #b9cbe0;
        border-radius: .8rem;
        background: #edf4fb;
      }
      .button {
        display: block;
        margin-top: 1rem;
        padding: .95rem 1rem;
        border-radius: .8rem;
        color: #fff;
        background: #2e74b5;
        text-align: center;
        text-decoration: none;
        font-weight: 800;
      }
      h2 { margin-top: 1.5rem; color: #163a5f; font-size: 1.1rem; }
      ol { padding-left: 1.35rem; line-height: 1.65; }
      code { padding: .1rem .25rem; border-radius: .25rem; background: #edf4fb; }
    </style>
  </head>
  <body>
    <main>
      <section class="title">
        <p class="eyebrow">Oxford 5000 B2-C1</p>
        <h1>한글 단어장 앱 설치</h1>
      </section>

      <section class="card">
        <p>아래 버튼으로 앱을 열고, 휴대폰 브라우저의 “홈 화면에 추가”를 선택하면 독립 앱처럼 사용할 수 있습니다.</p>
        <a class="button" href="https://nucode03.github.io/-5000-/">단어장 앱 열기</a>
      </section>

      <h2>Android Chrome</h2>
      <ol>
        <li>앱을 연 뒤 주소창 오른쪽 메뉴를 누릅니다.</li>
        <li><code>앱 설치</code> 또는 <code>홈 화면에 추가</code>를 선택합니다.</li>
      </ol>

      <h2>iPhone Safari</h2>
      <ol>
        <li>앱을 연 뒤 공유 버튼을 누릅니다.</li>
        <li><code>홈 화면에 추가</code>를 선택합니다.</li>
      </ol>
    </main>
  </body>
</html>
